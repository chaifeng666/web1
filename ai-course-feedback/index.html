:root{--bg:#fff7ec;--bg2:#ffe9d2;--ink:#2b2340;--muted:#6f6680;--primary:#ff6b4a;--primary2:#ff9f43;--accent:#6c5ce7;--shadow:0 10px 30px rgba(120,70,20,.14)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 10% 0%,#fff 0,var(--bg) 40%,var(--bg2) 100%) fixed;
  display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:36px 32px 30px;max-width:620px;width:100%;text-align:center}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:5px 16px;font-size:15px;font-weight:700;letter-spacing:1px}
h1{margin:14px 0 6px;font-size:clamp(24px,5.2vw,36px);font-weight:900;line-height:1.35;

.sub{margin:0 0 22px;color:var(--muted);font-size:17px}
.qr{display:inline-block;padding:16px;border-radius:22px;background:#fff;border:4px solid var(--primary2)}
.qr img{display:block;width:min(340px,70vw);height:auto;image-rendering:pixelated}
.scan{margin:14px 0 22px;font-size:18px;font-weight:700}
.url{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;background:#faf6ff;border:2px dashed #d9cff5;border-radius:16px;padding:14px}
.url a{font-size:clamp(20px,4.5vw,28px);font-weight:900;color:var(--accent);text-decoration:none;word-break:break-all}
.url a:hover{text-decoration:underline}
button{font-family:inherit;font-size:16px;font-weight:700;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
.thanks{margin:22px 0 0;color:var(--muted);font-size:15px}
</style>
